name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Retrieval guardrails (offline, no keys)
        run: npm run eval
      - name: Build the website
        run: npm run build
      - name: Build the API for Vercel (two-project route)
        run: npm run build:api
      - name: Build the single-project output (website and API together)
        run: npm run build:vercel
